<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Excercise 4</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Student Registration Form</h1>
            <p>Registration for your favorite school club</p>

            <form action="" method="get">
                <div class="form">
                    <label for="name">Full Name:</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    />
                </div>

                <div class="form">
                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    />
                </div>

                <div class="form">
                    <label for="course">Select Ypur Course</label>
                    <select id="course" required>
                        <option value="">Select a Course</option>
                        <option value="BSIT">BS Information Technology</option>
                        <option value="BSC">BS Crim</option>
                        <option value="BSBA">
                            BS in Business Administration
                        </option>
                        <option value="BSCPE">
                            BS Computer in Engineering
                        </option>
                        <option value="BSA">BS Accounting</option>
                    </select>
                </div>

                <div class="form">
                    <label for="reason"
                        >Why do you want to join the club?</label
                    >
                    <textarea
                        id="reason"
                        rows="5"
                        placeholder="Write your reason here..."
                    ></textarea>
                </div>

                <button type="submit">Submit Registration</button>
            </form>
        </div>
    </body>
</html>
